# ====================================================================
# WhatsApp Bot Automation Worker Configuration
# ====================================================================

[api]
# Base URL to the PHP API endpoint
base_url = http://localhost/whatapp_control_panel/web/api

[worker]
# Bearer Token generated in Web Admin -> Workers & WhatsApp -> Register New Worker
token = YOUR_WORKER_BEARER_TOKEN_HERE

# Frequency to poll for claimable jobs (seconds)
poll_interval_seconds = 5

# Frequency to send heartbeat updates to web server (seconds)
heartbeat_interval_seconds = 15

[browser]
# Browser executable to use: 'chromium', 'chrome', or 'msedge'
channel = chrome

# Headless mode for background sending ('true' or 'false')
headless = true

# Persistent profile folder for WhatsApp Web session
profile_dir = whatsapp_profile
